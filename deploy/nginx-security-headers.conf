# Sicherheits-Header für nginx – im server { … }-Block einbinden:
#   include /pfad/zu/nginx-security-headers.conf;
# Gleiche Werte wie in _headers und .htaccess.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), browsing-topics=(), clipboard-write=(self)" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Robots-Tag "noindex, nofollow" always;
# Erst aktivieren, wenn die Domain dauerhaft per HTTPS läuft:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Achtung: Ein add_header innerhalb eines location-Blocks hebt alle geerbten
# add_header-Zeilen auf. Für das Caching daher „expires“ verwenden:
location /assets/ {
  expires 1y;
}
location ~ ^/(tools|deploy)/ { return 404; }
location = /README.md { return 404; }
location = /_headers { return 404; }
